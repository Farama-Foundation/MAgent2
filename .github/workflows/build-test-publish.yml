# This workflow will build and (if release) publish Python distributions to PyPI
# For more information see:
#   - https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions
#   - https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
#

name: Build, test and publish Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-14 ]
        python: [ 310, 311, 312, 313, 314 ]
        include:
        - os: ubuntu-24.04
          platform-name: Linux x64
          wheel-platform: manylinux_x86_64
          artifact-platform: linux
        - os: ubuntu-24.04-arm
          platform-name: Linux ARM64
          wheel-platform: manylinux_aarch64
          artifact-platform: linux
        - os: macos-14
          platform-name: macOS ARM64
          wheel-platform: macosx_arm64
          artifact-platform: macos

    steps:
    - uses: actions/checkout@v7
    - name: Build ${{ matrix.platform-name }} wheels
      uses: pypa/cibuildwheel@v4.2.1
      env:
        CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.wheel-platform }}
        CIBW_ARCHS: auto
        CIBW_BUILD_VERBOSITY: 1

    - name: Store ${{ matrix.platform-name }} wheels
      uses: actions/upload-artifact@v7
      with:
        name: dist-${{ matrix.artifact-platform }}-cp${{ matrix.python }}-${{ matrix.wheel-platform }}
        path: ./wheelhouse/*.whl

  test:
    runs-on: ${{ matrix.os }}
    needs:
    - build-wheels
    strategy:
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-14 ]
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
        include:
        - os: ubuntu-24.04
          architecture: x64
          platform-name: Linux x64
          artifact-pattern: dist-linux-cp*-manylinux_x86_64
        - os: ubuntu-24.04-arm
          architecture: arm64
          platform-name: Linux ARM64
          artifact-pattern: dist-linux-cp*-manylinux_aarch64
        - os: macos-14
          architecture: arm64
          platform-name: macOS ARM64
          artifact-pattern: dist-macos-cp*-macosx_arm64

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.architecture }}

    - name: Download ${{ matrix.platform-name }} wheels
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ matrix.artifact-pattern }}
        path: dist
        merge-multiple: true

    - name: Install wheel and test dependencies
      run: |
        export PYTHON_VERSION=$(python -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')")
        python -m pip install --upgrade pip
        python -m pip install pytest "dist/"*"cp${PYTHON_VERSION}"*.whl

    - name: Remove source package
      run: rm -rf magent2

    - name: Run tests
      run: python -m pytest tests

  build-src:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build src
      run: |
        python -m pip install --upgrade pip
        pip install wheel
        python setup.py sdist
    - name: Store src
      uses: actions/upload-artifact@v7
      with:
        name: dist-source
        path: dist/*.tar.gz

  build-wheels-ms:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
        architecture: [ x64, arm64 ]
        exclude:
        - python-version: '3.10'
          architecture: arm64
        include:
        - architecture: x64
          os: windows-latest
        - architecture: arm64
          os: windows-11-arm

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.architecture }}

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3.0.0

    - name: Build wheel
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run:  |
        pip install wheel cmake-build-extension
        pip wheel .  --no-deps -w wheelhouse/

    - uses: actions/upload-artifact@v7
      with:
        name: dist-windows-${{ matrix.architecture }}-py${{ matrix.python-version }}
        path: ./wheelhouse/*.whl

  test-ms:
    runs-on: ${{ matrix.os }}
    needs:
    - build-wheels-ms
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
        architecture: [ x64, arm64 ]
        exclude:
        - python-version: '3.10'
          architecture: arm64
        include:
        - architecture: x64
          os: windows-latest
        - architecture: arm64
          os: windows-11-arm

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.architecture }}

    - name: Download wheel
      uses: actions/download-artifact@v8
      with:
        name: dist-windows-${{ matrix.architecture }}-py${{ matrix.python-version }}
        path: dist

    - name: Install wheel and test dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        python -m pip install (Get-ChildItem dist/*.whl)

    - name: Remove source package
      shell: pwsh
      run: Remove-Item -Recurse -Force magent2

    - name: Run tests
      run: python -m pytest tests

  publish:
    runs-on: ubuntu-latest
    needs:
    - build-wheels
    - build-wheels-ms
    - build-src
    - test
    - test-ms
    environment:
      name: pypi
      url: https://pypi.org/p/magent2
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
    - name: Download dists
      uses: actions/download-artifact@v8
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
